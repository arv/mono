[workspace]
resolver = "2"
members = [
  "crates/row-core",
  "crates/row-json",
  "crates/row-wasm",
  "crates/row-napi",
  "crates/ivm",
  "crates/size-probe",
]

# Optimize for small + fast wasm. Profile settings must live in the workspace
# root (cargo rejects them in member crates).
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
