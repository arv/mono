[package]
name = "size-probe"
version = "0.0.0"
edition = "2021"
publish = false

# Minimal wasm to measure the size floor: just the binary serializer with typed
# args — no serde_json (the JSON boundary), no ivm. Not shipped; a measurement.
[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
row-core = { path = "../row-core" }
