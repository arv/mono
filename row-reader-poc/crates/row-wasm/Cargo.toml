[package]
name = "row-wasm"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# wasm-opt is disabled because the POC build environment can't fetch the
# binaryen binary. The wasm is still optimized by LLVM via the release profile
# (opt-level = "s", lto). Re-enable for production-representative size/perf.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
row-core = { path = "../row-core" }
